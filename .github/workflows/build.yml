name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

# Concurrency groups are scoped per REPOSITORY, not per workflow, so this group must be
# prefixed with the workflow name. Without it, Build and Deploy share a group and cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny: each job opts into exactly the GITHUB_TOKEN scopes it needs.
permissions: {}

env:
  IMAGE: ghcr.io/t-ror/badi-menu

jobs:
  check-commits:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check commit messages
        id: check
        env:
          MESSAGES: ${{ toJson(github.event.commits) }}
        run: |
          if echo "$MESSAGES" | grep -qiP '"(feature|fix|refactor):'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [check-commits]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check-commits.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      # Actions are pinned to full commit SHAs: a tag is a mutable pointer, a commit is
      # not. The trailing comment is the human-readable version; Dependabot updates the
      # SHA and the comment together.
      - name: Set up SSH for private submodule
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DOCKER_REPO_SSH_KEY }}

      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.DOCKER_REPO_SSH_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and conditionally push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker
          file: ./docker/Dockerfile
          target: prod
          build-contexts: app-src=.
          build-args: |
            NGINX_CONFIG=nginx.prod.conf
            INSTALL_XDEBUG=false
          push: true
          # :latest is only moved on master. A workflow_dispatch build on a test branch
          # publishes its commit-SHA tag but leaves :latest — the server's fallback tag —
          # untouched, which is what makes branch testing safe. The empty string on
          # non-master is filtered out by the action's list parser.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
