doctrine:
    dbal:
        override_url: true
        url: '%env(resolve:DATABASE_URL)%'

        # Fallback only: doctrine-bundle merges the parsed DATABASE_URL over these
        # options (ConnectionFactory::parseDatabaseUrl), so a serverVersion= in the
        # URL wins over this value. Keep it matching the MariaDB image version in
        # docker-compose.yml anyway, for connections built without that parameter.
        server_version: 'mariadb-11.8.8'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
